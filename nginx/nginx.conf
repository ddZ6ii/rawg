gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript text/javascript application/json text/xml image/svg+xml;
gzip_min_length 512;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA support — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must always revalidate — it references hashed asset
    # filenames that change on every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets aggressively (versioned by build hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}