# Reference file — copy to vps-infra:/apps/rawg/gateway/nginx.conf

# Docker's embedded DNS server (always 127.0.0.11) — re-resolve upstream
# hostnames at most every 10s instead of caching them for the worker's
# lifetime, so nginx picks up new container IPs after a redeploy.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        # proxy_pass needs a variable (not a literal hostname) to force
        # per-request DNS resolution via the resolver above.
        set $backend_upstream backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:3000;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream frontend;
        # HTTP/1.1 for the gateway->frontend hop: without this nginx defaults
        # to 1.0, and the frontend's gzip module (gzip_http_version 1.1)
        # won't compress responses to 1.0 requests.
        proxy_http_version 1.1;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
    }
}
