packages:
  - frontend
  - backend
  - packages/*

# Single version pin shared across workspace packages — avoids drift between
# frontend and backend's own vitest without relying on pnpm hoisting (this
# repo keeps strict, non-hoisted node_modules).
catalog:
  vitest: ^4.1.9
  '@vitest/coverage-v8': ^4.1.9

overrides:
  ajv@<6.14.0: '>=6.14.0'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  tmp@<=0.2.3: '>=0.2.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0' # GHSA-j3q9-mxjg-w52f — DoS via sequential optional groups, pulled in transitively by express@5's router dependency
  '@eslint/eslintrc>ajv': ^6.12.4
  postcss: ^8.5.18
  nanoid: ^3.3.18
  picomatch@>=4.0.0 <4.0.4: ^4.0.4

# Mitigate supply chain attacks
minimumReleaseAge: '4320' # 3 days (in minutes)
ignore-scripts: 'true'

# esbuild's postinstall just places its platform binary (no network access,
# no arbitrary code beyond that). pnpm 11 hard-fails `install --frozen-lockfile`
# with ERR_PNPM_IGNORED_BUILDS unless a decision is explicitly recorded here —
# `pnpm approve-builds esbuild` writes this. Without it, both Docker builds
# (and any other frozen-lockfile install, e.g. CI) fail outright.
allowBuilds:
  esbuild: true
