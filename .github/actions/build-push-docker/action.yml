name: 'Build and Push Docker Image'
description: 'Common setup steps for building and pushing Docker images'

inputs:
  docker-username:
    description: 'Docker username'
    required: true
  docker-token:
    description: 'Docker personal access token'
    required: true
  docker-repository:
    description: 'Name of Dockerhub repository'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: true
  image-tag:
    description: 'Docker image tag'
    required: true
  latest-tag:
    description: 'Additional tag to also push (e.g. "frontend-latest"); leave empty to skip'
    required: false
    default: ''
  version:
    description: 'Image version label (org.opencontainers.image.version)'
    required: false
    default: 'unknown'
  revision:
    description: 'Git commit SHA (org.opencontainers.image.revision)'
    required: false
    default: 'unknown'

runs:
  using: 'composite'
  steps:
    # Sanitize inputs through env vars before passing to build-args to prevent injection via crafted values.
    - name: Prepare build metadata
      id: meta
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
      run: |
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

    # Enable multi-platform builds within Docker workflows by installing QEMU static binaries.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    # Create and boot a builder to be used in the following steps.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Build and load into the runner's local Docker daemon (no push yet) so Trivy can scan it.
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        push: false
        load: true
        context: '{{defaultContext}}'
        file: ${{ inputs.dockerfile-path }}
        tags: ${{ inputs.docker-repository }}:${{ inputs.image-tag }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          REVISION=${{ steps.meta.outputs.revision }}

    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: '${{ inputs.docker-repository }}:${{ inputs.image-tag }}' # the locally loaded image
        format: table
        exit-code: '1' # fail the pipeline on HIGH/CRITICAL findings
        ignore-unfixed: true # skip CVEs with no available fix
        severity: 'HIGH,CRITICAL'
        scanners: vuln # vulnerability scanning only — secret scanning finds nothing on these images and costs CI time
        trivyignores: .trivyignore # explicit path, rather than relying on Trivy's implicit cwd-relative default
        output: trivy-results.txt

    # Always upload results to the job summary, even when the scan step fails.
    - name: Upload scan results to job summary
      if: '!cancelled()' # show results even if scan step fails, but skip promptly on a cancelled run
      shell: bash
      run: |
        if [ -f trivy-results.txt ]; then
          cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
        else
          echo "trivy-results.txt not found — Trivy may have crashed before scanning." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-token }}

    - name: Push to Docker Hub
      uses: docker/build-push-action@v7
      with:
        push: true
        context: '{{defaultContext}}'
        file: ${{ inputs.dockerfile-path }}
        # ⚠️ The official docker/build-push-action uses the multiline format as its standard for multiple tags, not comma-separated.
        tags: |
          ${{ inputs.docker-repository }}:${{ inputs.image-tag }}
          ${{ inputs.latest-tag != '' && format('{0}:{1}', inputs.docker-repository, inputs.latest-tag) || '' }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          REVISION=${{ steps.meta.outputs.revision }}
