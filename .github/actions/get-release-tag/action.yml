name: 'Get Release Tag'
description: 'Detects whether semantic-release published a new release on this run and outputs its version/sha'

inputs:
  before-sha:
    description: 'HEAD commit SHA captured before semantic-release ran, in the same checkout — used to confirm HEAD actually moved this run, not just that a matching tag happens to point at it'
    required: true

outputs:
  released:
    description: "'true' if a new release was published on this run, 'false' otherwise"
    value: ${{ steps.detect.outputs.released }}
  version:
    description: 'Released version without the v prefix (e.g. 1.2.3) — only set when released is true'
    value: ${{ steps.detect.outputs.version }}
  sha:
    description: 'Commit SHA the release tag points at — only set when released is true'
    value: ${{ steps.detect.outputs.sha }}

runs:
  using: 'composite'
  steps:
    # semantic-release doesn't natively emit GITHUB_OUTPUT. Detecting via a
    # version-format tag pointing at the current HEAD (after semantic-release
    # has run in the same job/checkout) is decoupled from semantic-release's
    # internal implementation and directly verifiable, unlike parsing stdout
    # or the release commit's message text.
    #
    # `git tag --points-at HEAD` alone can't distinguish a tag created by THIS
    # run from a pre-existing tag that happens to already point at HEAD (e.g.
    # a push to `main` that lands exactly on an already-tagged commit, with no
    # release-worthy commits since). Comparing `before-sha` (captured by the
    # caller before semantic-release ran) against the current HEAD closes that
    # gap: released is only reported `true` when HEAD actually changed AND a
    # matching tag points at the new HEAD.
    - name: Detect release tag at HEAD
      id: detect
      shell: bash
      env:
        BEFORE_SHA: ${{ inputs.before-sha }}
      run: |
        # No `git fetch --tags` here: semantic-release's `@semantic-release/git`
        # plugin already creates the release tag locally, in this same checkout,
        # before this composite action runs — nothing to fetch. Re-fetching would
        # also be a latent footgun if this repo is ever made private (today it's
        # a public, anonymous HTTPS fetch that always succeeds; a private repo
        # would need auth, and this runs under `bash -eo pipefail` after the
        # release may already be published — the worst point to fail).
        AFTER_SHA=$(git rev-parse HEAD)
        TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
        if [ -n "$TAG" ] && [ "$AFTER_SHA" != "$BEFORE_SHA" ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi
