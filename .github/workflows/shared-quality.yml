# Reusable workflow for running code quality checks
name: shared-quality

on:
  workflow_call: # 👈 makes the workflow reusable and allows it to be called from other workflows

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Format code
        run: pnpm run format:check

      - name: Lint code
        run: pnpm run lint

  check-licences:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Audit dependency licenses
        run: ./scripts/check-licences.sh

  audit-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Audit dependencies
        run: pnpm dlx audit-ci@7.1.0 --config .audit-ci.json # pin the version explicitly — an unpinned "latest" could silently turn a green branch red on an upstream release

  audit-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@v0.5.0
        with:
          config: zizmor.yml
          advanced-security: false # output to CI logs only — security-events: write not granted

  test:
    needs: [code-quality, check-licences, audit-deps, audit-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Run tests
        run: pnpm run test
