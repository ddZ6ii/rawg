name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  code-quality:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [code-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.get-release.outputs.released }}
      version: ${{ steps.get-release.outputs.version }}
      sha: ${{ steps.get-release.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Capture pre-release HEAD
        id: pre-release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: '0'
        run: pnpm exec semantic-release

      - name: Detect whether a release was published
        id: get-release
        uses: ./.github/actions/get-release-tag
        with:
          before-sha: ${{ steps.pre-release.outputs.sha }}

  build-and-push:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Build and push frontend image to Docker Hub
        uses: ./.github/actions/build-push-docker
        with:
          docker-username: ${{ vars.DOCKERHUB_USERNAME }}
          docker-repository: ${{ vars.DOCKERHUB_USERNAME }}/rawg
          docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
          dockerfile-path: frontend/Dockerfile
          latest-tag: frontend-latest
          image-tag: frontend-v${{ needs.release.outputs.version }}
          version: v${{ needs.release.outputs.version }}
          revision: ${{ needs.release.outputs.sha }}

      - name: Build and push backend image to Docker Hub
        uses: ./.github/actions/build-push-docker
        with:
          docker-username: ${{ vars.DOCKERHUB_USERNAME }}
          docker-repository: ${{ vars.DOCKERHUB_USERNAME }}/rawg
          docker-token: ${{ secrets.DOCKERHUB_TOKEN }}
          dockerfile-path: backend/Dockerfile
          latest-tag: api-latest
          image-tag: api-v${{ needs.release.outputs.version }}
          version: v${{ needs.release.outputs.version }}
          revision: ${{ needs.release.outputs.sha }}

  # Sync back dev branch after release, keeping both branches non-divergent
  # and preserving the linear-history workflow.
  sync-dev:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Intentionally does NOT set persist-credentials: false — this job
      # needs to git push after rebasing dev onto main (documented
      # `artipacked` zizmor exception, see docs/audit-github-actions.md).
      - name: Check out code
        uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Rebase dev onto main
        env:
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout dev
          git rebase origin/main
          git push --force-with-lease origin dev
