services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - ${GATEWAY_PORT:-8000}:80
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: backend/.env
    ports:
      - '3001:3000'
